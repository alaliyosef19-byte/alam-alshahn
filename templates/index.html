<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>عالم الشحن</title>

<style>
*{box-sizing:border-box}
:root{--pink:#f43f72;--red:#ef4444;--pale:#fff0f4;--ink:#29232b;--muted:#88818a;--line:#f2e5e9}
body{margin:0;background:#fff;color:var(--ink);font-family:Arial,sans-serif;padding-bottom:82px}
.top{padding:14px 15px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:9px;position:sticky;top:0;z-index:100}
.logo{font-size:20px;font-weight:900;color:var(--pink)}
.balance{background:var(--pale);border:1px solid #ffd0dc;border-radius:12px;padding:8px 10px;font-weight:bold;color:#d92e60}
.login{background:var(--pink);color:#fff;border:0;border-radius:11px;padding:10px 12px;font-weight:bold}
.container{padding:16px 12px}
h1{font-size:22px;margin:8px 0;color:#29232b}
.sub{color:var(--muted);margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}.grid .card{min-width:0;padding:12px 3px;min-height:100px;border-radius:13px}.grid .icon{font-size:27px;margin-bottom:7px}.grid .card b{font-size:12px;line-height:1.5}.grid .card button{font-size:10px;padding:7px 3px;width:100%;white-space:normal}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px 8px;text-align:center;min-height:112px;box-shadow:0 3px 12px #6e24300a}
.icon{font-size:34px;margin-bottom:8px}
.card b{display:block;font-size:14px}
.card button,.package button{margin-top:10px;background:var(--pink);color:#fff;border:0;border-radius:10px;padding:9px 12px;font-weight:bold}
.hidden{display:none!important}
.back{background:var(--pale);border:1px solid #ffd0dc;color:#c72c59;border-radius:10px;padding:9px 14px;margin-bottom:15px}
.items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.package{background:#fff;border:1px solid var(--line);border-radius:15px;padding:12px;box-shadow:0 3px 12px #6e243008}
.package .price{color:var(--pink);font-size:18px;font-weight:bold;margin-top:8px}
.bottom{position:fixed;z-index:9999;bottom:0;left:0;right:0;height:68px;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;box-shadow:0 -4px 18px #41202a0a}
.bottom button{background:none;border:0;color:#77717a;font-size:12px;display:flex;flex-direction:column;gap:4px;align-items:center;padding:7px 4px}
.bottom button:active,.bottom button.active{color:var(--pink)}
.bottom span{font-size:21px}
.modal{position:fixed;inset:0;background:#0008;z-index:10000;display:flex;align-items:center;justify-content:center;padding:18px}
.box{width:100%;max-width:430px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;color:var(--ink)}
.box input,.box textarea{width:100%;margin:7px 0;padding:12px;border-radius:10px;border:1px solid #eadde2;background:#fff;color:var(--ink)}
.box button{padding:11px 15px;border:0;border-radius:10px;background:var(--pink);color:#fff;font-weight:bold;margin-top:8px}
.close{float:left;background:#756b74!important}
.sham{background:#fff5f7;border:1px solid #ffd0dc;border-radius:12px;padding:13px;line-height:2;color:#51434a}
.app-image{width:100%;height:130px;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:13px;margin-bottom:10px;background:#fff3f6}
.app-image img{width:100%;height:100%;object-fit:contain;display:block}
.no-image{font-size:42px;opacity:.5}
.app-card{display:flex;flex-direction:column;gap:10px;padding:10px;margin:0;border-radius:16px;background:#fff;border:1px solid var(--line);box-sizing:border-box;overflow:hidden;box-shadow:0 3px 14px #6e24300a}
.app-card b{display:block;text-align:center;font-size:14px;line-height:1.5;color:var(--ink)}
.app-card button{width:100%;border:0;border-radius:10px;padding:10px 12px;cursor:pointer;background:var(--pink);color:#fff;font-weight:bold}
.telecom-card{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 4px 15px #6e24300d;cursor:pointer;transition:.2s}
.telecom-card:active{transform:scale(.98)}
.telecom-card .app-image{height:120px;margin:0;border-radius:0;background:#fff3f6}
.telecom-card .telecom-name{padding:12px 8px;text-align:center;font-weight:900;font-size:14px;color:var(--ink)}
.telecom-packages{display:none;grid-column:1/-1;background:#fff7f9;border:1px solid var(--line);border-radius:15px;padding:12px;margin-top:-5px}
.telecom-packages.open{display:block}
.telecom-package{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px;margin-bottom:8px}
.telecom-package:last-child{margin-bottom:0}
.telecom-package .tp-info{min-width:0}
.telecom-package .tp-name{font-weight:bold;line-height:1.5}
.telecom-package .tp-price{color:var(--pink);font-weight:900;margin-top:3px}
.telecom-package button{flex-shrink:0;background:var(--pink);color:#fff;border:0;border-radius:9px;padding:8px 11px;font-weight:bold}
@media(max-width:360px){.grid{gap:4px}.grid .icon{font-size:24px}.grid .card b{font-size:11px}.grid .card button{font-size:9px;padding:7px 1px}.top{padding:11px 8px}.logo{font-size:17px}.balance{font-size:12px;padding:7px}.login{padding:8px;font-size:12px}}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.items{grid-template-columns:repeat(4,minmax(0,1fr))}.container{max-width:1100px;margin:auto}}

.search-wrap{display:flex;align-items:center;gap:10px;margin:14px 12px;padding:12px 14px;background:#fff2f5;border:1px solid #ffd4df;border-radius:14px;color:#f43f72}
.search-wrap span{font-size:20px}
.search-wrap input{width:100%;min-width:0;border:0;outline:0;background:transparent;color:#29232b;font-size:15px}
.search-wrap input::placeholder{color:#a69aa0}
</style>

</head>
<body>

<header class="top">
  <div class="logo">عالم الشحن</div>
  <div class="balance">
الرصيد: <span id="balance">0.00$</span>
<span id="usernameTop" style="margin-right:8px"></span>
</div>
<button id="loginBtn" class="login" onclick="openLogin()">تسجيل الدخول</button>
<button id="logoutBtn" class="login hidden" onclick="logout()">تسجيل الخروج</button>
<button id="adminBtn" class="login hidden" onclick="openAdmin()">⚙️ الإدارة</button>
</header>

<div class="search-wrap">
  <span>🔎</span>
  <input id="siteSearch" type="search" placeholder="ابحث عن لعبة أو تطبيق..." autocomplete="off">
</div>


<main class="container">

<section id="home">
<h1>الأقسام</h1>
<div class="sub">اختر القسم الذي تريد الشحن منه</div>
<div class="grid">
  <div class="card"><div class="icon">🎮</div><b>الألعاب</b><button onclick="openSection('games')">عرض التطبيقات</button></div>
  <div class="card"><div class="icon">📱</div><b>تطبيقات اللايف</b><button onclick="openSection('live')">عرض التطبيقات</button></div>
  <div class="card"><div class="icon">📡</div><b>الاتصالات</b><button onclick="openSection('telecom')">عرض التطبيقات</button></div>
  <div class="card"><div class="icon">🔑</div><b>التفعيل</b><button onclick="openSection('activation')">عرض التطبيقات</button></div>
  <div class="card"><div class="icon">🛒</div><b>المتاجر الرقمية</b><button onclick="openSection('stores')">عرض التطبيقات</button></div>
</div>
</section>

<section id="section" class="hidden">
<button class="back" onclick="showHome()">← رجوع للأقسام</button>
<h1 id="sectionTitle"></h1>

</section>

<section id="packages" class="hidden">
<button class="back" onclick="showSection()">← رجوع</button>
<h1 id="packagesTitle"></h1>
<div class="sub">الباقات المتاحة</div>
<div id="packageList" class="items"></div>
</section>

<section id="admin" class="hidden">
<button class="back" onclick="showHome()">← العودة</button>
<h1>⚙️ لوحة الإدارة</h1>
<div class="sub">إدارة طلبات الإيداع</div>
<div id="adminDeposits" class="items">
<div class="sub">جاري تحميل الطلبات...</div>
</div>
</section>

<section id="orders" class="hidden">
<h1>طلباتي</h1>
<div id="ordersList" class="items"></div>
</section>

</main>

<nav class="bottom">
<button onclick="showHome()"><span>🏠</span>الرئيسية</button>
<button onclick="showOrders()"><span>📦</span>طلباتي</button>
<button onclick="openDeposit()"><span>💰</span>إيداع</button>
<button onclick="openSupport()"><span>🎧</span>الدعم</button>
</nav>

<div id="modal" class="modal hidden">
<div class="box">
<button class="close" onclick="closeModal()">✕</button>
<div id="modalContent"></div>
</div>
</div>

<script>
let allProducts=[];
let currentSection="";
let currentApp="";

const sections={
 games:{title:"🎮 الألعاب",keys:["PUBG","FREE FIRE","CALL OF DUTY","MOBILE LEGENDS","GAME"]},
 live:{title:"📱 تطبيقات اللايف",keys:["LIVE","CHAT","TALK","LUDO","TUMILE","LIVU","YALLA","BIGO","LIKEE","POPPO","MANGO","HAGO","HOOB","BOBO","VOVA","HAIO","YOKI","DIKA","KARAK","MIKOO","HALLA","ROOH","DOLI","SUGO","STAR MAKER"]},
 telecom:{title:"📡 الاتصالات",keys:["SYRIATEL","MTN","TELECOM","DATA","INTERNET","BAKA","BUNDLE"]},
 activation:{title:"🔑 التفعيل",keys:["NETFLIX","SHAHID","SHAHED","SHAMNA","IPTV"]},
 stores:{title:"🛒 المتاجر الرقمية",keys:["STORE","STEAM","PLAYSTATION","XBOX","APPLE","GOOGLE","ITUNES","RAZER"]}
};

function esc(x){
 return String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}

function hideAll(){
 ["home","section","packages","orders"].forEach(x=>document.getElementById(x).classList.add("hidden"));
}

function showHome(){
 hideAll();
 document.getElementById("home").classList.remove("hidden");
}

function showSection(){
 hideAll();
 document.getElementById("section").classList.remove("hidden");
}

function showOrders(){
 hideAll();
 document.getElementById("orders").classList.remove("hidden");
 loadOrders();
}

async function api(url,opt={}){
 const r=await fetch(url,opt);
 return await r.json();
}

async function loadBalance(){
 try{
  const x=await api("/api/me");
  const u=x.user || x;

  if(u && u.username){
    document.getElementById("balance").textContent=Number(u.balance||0).toFixed(2)+"$";
    document.getElementById("usernameTop").textContent="👤 "+u.username;
    document.getElementById("loginBtn").classList.add("hidden");
    document.getElementById("logoutBtn").classList.remove("hidden");
    if(u.is_admin){
      document.getElementById("adminBtn").classList.remove("hidden");
    }else{
      document.getElementById("adminBtn").classList.add("hidden");
    }
  }else{
    document.getElementById("balance").textContent="0.00$";
    document.getElementById("usernameTop").textContent="";
    document.getElementById("loginBtn").classList.remove("hidden");
    document.getElementById("logoutBtn").classList.add("hidden");
  }
 }catch(e){}
}

async function logout(){
 try{
  await api("/api/logout",{method:"POST"});
 }catch(e){}
 location.reload();
}

async function loadProducts(){
  allProducts=[];
}

function matchProduct(p,keys){
 const n=(p.name||"").toUpperCase();
 return keys.some(k=>n.includes(k));
}

async function openSection(name){
 hideAll();
 currentSection=name;
 document.getElementById("section").classList.remove("hidden");
 document.getElementById("apps").classList.remove("hidden");

 const box=document.getElementById("apps");
 box.innerHTML="<div class='sub'>جاري التحميل...</div>";

 try{
   const data=await api("/api/apps?section="+encodeURIComponent(name)+"&limit=50&offset=0");
   const apps=data.apps||[];

   if(!apps.length){
     box.innerHTML="<div class='sub'>لا توجد منتجات في هذا القسم.</div>";
     return;
   }

   if(name==="telecom"){
     box.innerHTML=apps.map((app,i)=>`
       <div class="telecom-card" onclick="toggleTelecom(${i})">
         <div class="app-image">
           ${app.image
             ? `<img src="${esc(app.image)}" loading="lazy" onerror="this.style.display='none'">`
             : `<div class="no-image">📡</div>`}
         </div>
         <div class="telecom-name">${esc(app.name)}</div>
       </div>

       <div id="telecom-packages-${i}" class="telecom-packages">
         <div class="sub">اضغط لإظهار الباقات...</div>
       </div>
     `).join("");

     window.telecomApps=apps;
   }else{
     box.innerHTML=apps.map(app=>`
       <div class="app-card">
         <div class="app-image">
           ${app.image
             ? `<img src="${esc(app.image)}" loading="lazy" onerror="this.style.display='none'">`
             : `<div class="no-image">📦</div>`}
         </div>
         <b>${esc(app.name)}</b>
         <button onclick='showPackages(${JSON.stringify((app.products||[]).map(x=>Number(x.id)).filter(Boolean))}, ${JSON.stringify(app.name||"")})'>عرض الباقات</button>
       </div>
     `).join("");

     if(data.has_more){
       box.insertAdjacentHTML("beforeend",`
         <button class="more-btn" onclick="loadMoreApps('${name}',50)">
           تحميل المزيد
         </button>
       `);
     }
   }
 }catch(e){
   console.error(e);
   box.innerHTML="<div class='sub'>تعذر تحميل البيانات.</div>";
 }
}

async function toggleTelecom(index){
 const apps=window.telecomApps||[];
 const app=apps[index];
 if(!app)return;

 const box=document.getElementById("telecom-packages-"+index);
 if(!box)return;

 if(box.classList.contains("open")){
   box.classList.remove("open");
   return;
 }

 document.querySelectorAll(".telecom-packages.open").forEach(x=>{
   x.classList.remove("open");
 });

 box.classList.add("open");
 box.innerHTML="<div class='sub'>جاري تحميل الباقات...</div>";

 try{
   const ids=(app.products||[])
     .map(x=>Number(x.id))
     .filter(Boolean);

   if(!ids.length){
     box.innerHTML="<div class='sub'>لا توجد باقات لهذا المنتج.</div>";
     return;
   }

   const data=await api(
     "/api/app-packages?ids="+encodeURIComponent(ids.join(","))
   );

   const ps=data && Array.isArray(data.packages)
     ? data.packages
     : [];

   if(!ps.length){
     box.innerHTML="<div class='sub'>لا توجد باقات لهذا المنتج.</div>";
     return;
   }

   box.innerHTML=ps.map(p=>`
     <div class="telecom-package">
       <div class="tp-info">
         <div class="tp-name">${esc(p.name)}</div>
         <div class="tp-price">
           ${Number(p.store_price??p.price??0).toFixed(2)} $
         </div>
       </div>
       <button onclick="event.stopPropagation();buy(${Number(p.id)})">
         شراء
       </button>
     </div>
   `).join("");

 }catch(e){
   console.error(e);
   box.innerHTML="<div class='sub'>تعذر تحميل الباقات.</div>";
 }
}

async function loadMoreApps(section,offset){
 const box=document.getElementById("apps");
 const old=document.querySelector(".more-btn");
 if(old) old.remove();

 try{
   const data=await api("/api/apps?section="+encodeURIComponent(section)+"&limit=50&offset="+offset);
   const apps=data.apps||[];

   if(section==="telecom"){
     const startIndex=(window.telecomApps||[]).length;
     window.telecomApps=(window.telecomApps||[]).concat(apps);

     box.insertAdjacentHTML("beforeend",apps.map((app,j)=>{
       const i=startIndex+j;
       return `
       <div class="telecom-card" onclick="toggleTelecom(${i})">
         <div class="app-image">
           ${app.image
             ? `<img src="${esc(app.image)}" loading="lazy" onerror="this.style.display='none'">`
             : `<div class="no-image">📡</div>`}
         </div>
         <div class="telecom-name">${esc(app.name)}</div>
       </div>
       <div id="telecom-packages-${i}" class="telecom-packages">
         <div class="sub">اضغط لإظهار الباقات...</div>
       </div>`;
     }).join(""));
   }else{
     box.insertAdjacentHTML("beforeend",apps.map(app=>`
       <div class="app-card">
         <div class="app-image">
           ${app.image ? `<img src="${esc(app.image)}" loading="lazy" onerror="this.style.display='none'">` : `<div class="no-image">📦</div>`}
         </div>
         <b>${esc(app.name)}</b>
         <button onclick='showPackages(${JSON.stringify((app.products||[]).map(x=>Number(x.id)).filter(Boolean))}, ${JSON.stringify(app.name||"")})'>عرض الباقات</button>
       </div>
     `).join(""));
   }

   if(data.has_more){
     box.insertAdjacentHTML("beforeend",`
       <button class="more-btn" onclick="loadMoreApps('${section}',${offset+50})">
         تحميل المزيد
       </button>
     `);
   }
 }catch(e){
   console.error(e);
   box.insertAdjacentHTML("beforeend","<div class='sub'>تعذر تحميل المزيد.</div>");
 }
}

async function showPackages(productIds,name){
  currentApp=name;
  hideAll();

  document.getElementById("packages").classList.remove("hidden");
  document.getElementById("packagesTitle").textContent=name;

  const list=document.getElementById("packageList");
  list.innerHTML="<div class='sub'>جاري تحميل الباقات...</div>";

  try{
    const ids=Array.isArray(productIds)
      ? productIds.map(Number).filter(Boolean)
      : [Number(productIds)].filter(Boolean);

    if(!ids.length){
      list.innerHTML="<div class='sub'>لا توجد باقات لهذا التطبيق.</div>";
      return;
    }

    const data=await api("/api/app-packages?ids="+encodeURIComponent(ids.join(",")));
    const rawPackages=data && Array.isArray(data.packages) ? data.packages : [];
    const seenPackages=new Set();
    const ps=rawPackages.filter(p=>{
      const name=String(p.name||"").trim().replace(/\s+/g," ").toUpperCase();
      const price=Number(p.store_price??p.price??0).toFixed(2);
      const type=String(p.product_type||"").trim().toUpperCase();
      const params=JSON.stringify(p.params||[]);
      const qty=JSON.stringify(p.qty_values||null);
      const key=JSON.stringify([name,price,type,params,qty]);
      if(seenPackages.has(key)) return false;
      seenPackages.add(key);
      return true;
    });

    if(!ps.length){
      list.innerHTML="<div class='sub'>لا توجد باقات لهذا التطبيق.</div>";
      return;
    }

    list.innerHTML=ps.map(p=>`
      <div class="package">
        <b>${esc(p.name)}</b>
        <div class="price">${Number(p.store_price??p.price??0).toFixed(2)} $</div>
        <button onclick="buy(${Number(p.id)})">شراء</button>
      </div>
    `).join("");

  }catch(e){
    console.error(e);
    list.innerHTML="<div class='sub'>تعذر تحميل الباقات.</div>";
  }
}

async function buy(id){
 openModal(`
 <h2>شراء الباقة</h2>
 <input id="player" placeholder="Player ID / رقم العميل">
 <input id="qty" type="number" value="1" min="1" placeholder="الكمية">
 <button onclick="sendOrder(${id})">تأكيد الشراء</button>
 `);
}

async function sendOrder(id){
 const player=document.getElementById("player").value.trim();
 const qty=document.getElementById("qty").value||1;
 if(!player){alert("أدخل رقم العميل");return}
 const x=await api("/api/order",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({product_id:id,playerId:player,qty:Number(qty)})});
 alert(x.message||x.error||(x.success?"تم الطلب":"تعذر تنفيذ الطلب"));
 if(x.success) closeModal();
 await loadBalance();
}

function openModal(html){
 document.getElementById("modalContent").innerHTML=html;
 document.getElementById("modal").classList.remove("hidden");
}
function closeModal(){document.getElementById("modal").classList.add("hidden")}

function openLogin(){
 openModal(`
 <h2>تسجيل الدخول</h2>
 <input id="username" placeholder="اسم المستخدم">
 <input id="password" type="password" placeholder="كلمة المرور">
 <button onclick="login()">دخول</button>
 <button onclick="register()">إنشاء حساب</button>
 `);
}

async function login(){
 const x=await api("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:username.value,password:password.value})});
 alert(x.message||x.error||(x.success?"تم تسجيل الدخول":"تعذر الدخول"));
 if(x.success){closeModal();await loadBalance()}
}

async function openAdmin(){
  try{
    const me=await api("/api/me");
    const u=me.user || me;
    if(!u || !u.is_admin){
      alert("غير مسموح");
      return;
    }

    hideAll();
    document.getElementById("admin").classList.remove("hidden");
    await loadAdminDeposits();
  }catch(e){
    alert("تعذر فتح لوحة الإدارة");
  }
}

async function loadAdminDeposits(){
  const box=document.getElementById("adminDeposits");
  try{
    const x=await api("/api/admin");
    const deposits=x.deposits || [];

    if(!deposits.length){
      box.innerHTML="<div class='sub'>لا توجد طلبات إيداع حالياً.</div>";
      return;
    }

    box.innerHTML=deposits.map(d=>`
      <div class="package">
        <b>المستخدم: ${esc(d.username||"")}</b>
        <div>المبلغ: <strong>${esc(d.amount)} $</strong></div>
        <div>الطريقة: ${esc(d.method||"Sham Cash")}</div>
        <div>رقم العملية: ${esc(d.proof||"")}</div>
        <div>الحالة: ${esc(d.status||"")}</div>
        ${String(d.status||"").toLowerCase()=="pending" ? `
          <button onclick="depositAction(${Number(d.id)},'approve')">✅ موافقة</button>
          <button onclick="depositAction(${Number(d.id)},'reject')" style="background:#8b2635">❌ رفض</button>
        ` : ""}
      </div>
    `).join("");
  }catch(e){
    box.innerHTML="<div class='sub'>تعذر تحميل طلبات الإيداع.</div>";
  }
}

async function depositAction(id,action){
  if(!confirm(action==="approve" ? "تأكيد الموافقة على الإيداع؟" : "تأكيد رفض الإيداع؟")) return;

  const x=await api("/api/admin/deposit/"+id,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({action})
  });

  alert(x.message || x.error || (x.success?"تم":"تعذر تنفيذ العملية"));
  await loadAdminDeposits();
}

  const input=document.getElementById("siteSearch");
  if(!input)return;
  input.addEventListener("input",function(){
    const q=input.value.trim().toLocaleLowerCase();
    document.querySelectorAll("#apps .app-card,#apps .telecom-card,#apps .card").forEach(function(card){
      card.style.display=(!q||card.innerText.toLocaleLowerCase().includes(q))?"":"none";

});
