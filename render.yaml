services:
  - type: web
    name: alam-alshahn
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: SHAM4STORE_BASE_URL
        value: https://api.sham4store.com
      - key: SHAM_STORE_API_TOKEN
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
